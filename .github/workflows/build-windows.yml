name: Fabrication Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements-dev.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Fabrication de MesComptes.exe
        run: pyinstaller --noconfirm MesComptes.spec

      - name: Mise à disposition (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: MesComptes-Windows
          path: dist/MesComptes.exe

      - name: Publication (version étiquetée v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MesComptes.exe
